name: safetycar

services:
  db:
    # Tag fixada: PostgreSQL 16 + PostGIS 3.6. Digest registrado em docs/BANCO_DE_DADOS.md.
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      SAFETYCAR_MIGRATOR_PASSWORD: ${SAFETYCAR_MIGRATOR_PASSWORD:?defina SAFETYCAR_MIGRATOR_PASSWORD no .env}
      SAFETYCAR_APP_PASSWORD: ${SAFETYCAR_APP_PASSWORD:?defina SAFETYCAR_APP_PASSWORD no .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORTA:-5432}:5432"
    volumes:
      - safetycar_pgdata:/var/lib/postgresql/data
      # Executado só na primeira inicialização do volume: cria papéis e o banco.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Saudável apenas quando o banco safetycar (criado pelo init) aceita conexões.
      test: ["CMD-SHELL", "pg_isready -U postgres -d safetycar"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Banco próprio do Keycloak, separado do banco de negócio. Sem porta publicada:
  # só o contêiner do Keycloak o acessa, pela rede interna do compose.
  keycloak-db:
    # Tag fixada. Digest registrado em docs/KEYCLOAK.md.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
      TZ: UTC
    volumes:
      - safetycar_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Keycloak em modo de desenvolvimento (HTTP, só em 127.0.0.1). Não é configuração de produção.
  keycloak:
    # Tag fixada. Digest registrado em docs/KEYCLOAK.md.
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    # --import-realm: importa keycloak/realms/*.json se o realm ainda não existir.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
      # Administrador inicial (realm master); só é criado se ainda não houver administrador.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:?defina KEYCLOAK_ADMIN_USUARIO no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_SENHA:?defina KEYCLOAK_ADMIN_SENHA no .env}
      # Endereço público fixo: o "iss" dos tokens fica estável e igual ao KEYCLOAK_ISSUER da API.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORTA:-8080}
      KC_HEALTH_ENABLED: "true"
      TZ: UTC
    ports:
      - "127.0.0.1:${KEYCLOAK_PORTA:-8080}:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl: consulta /health/ready na porta de gerenciamento (9000) via bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  safetycar_pgdata:
    name: safetycar_pgdata
  safetycar_keycloak_pgdata:
    name: safetycar_keycloak_pgdata
