# Tema de login do Safety Car. Só CSS, mensagens e recursos: nenhum template .ftl sobrescrito,
# para não ter de reconciliar templates a cada upgrade do Keycloak (ver docs/KEYCLOAK.md).
parent=keycloak.v2
import=common/keycloak

# Mantém o CSS do tema pai e acrescenta o do Safety Car por cima.
styles=css/styles.css css/safetycar.css

# Identidade fixa (fundo escuro no celular, painel claro no desktop). Desligar o modo escuro
# também remove o script inline que o tema pai usa para alterná-lo.
darkMode=false
